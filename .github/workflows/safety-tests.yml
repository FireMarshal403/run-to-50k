name: Run to 50K safety tests
on:
  push:
    branches: [dev/cross-device-sync]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and run synthetic regression tests
        run: node --test tests/*.test.cjs
